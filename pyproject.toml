[project]
name = "gen-img"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "numpy",
    "pillow",
    "scikit-image",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_img"]
