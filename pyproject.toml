[project]
name = "gen-img"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy",
    "pillow",
    "scikit-image",
    "scipy",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_img"]
